# BIOTORF Business OS · развёртывание на Render.com (Blueprint)
databases:
  - name: biotorf-crm-db
    databaseName: biotorf
    user: biotorf
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: biotorf-backend
    runtime: docker
    region: oregon
    plan: free
    repo: https://github.com/Biotorf/BioTorf
    branch: main
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biotorf-crm-db
          property: connectionString
      - key: DB_BACKEND
        value: postgres
      - key: AUTH_PASSWORD
        value: CHANGE_ME_password_for_crm_login
      - key: AUTH_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_WEBHOOK_SECRET
        value: ""
      - key: WHATSAPP_TOKEN
        value: ""
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: ""

  - type: web
    name: biotorf-frontend
    runtime: static
    region: oregon
    repo: https://github.com/Biotorf/BioTorf
    branch: main
    rootDir: biotorf-os
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: VITE_COMMS_API
        value: https://biotorf-backend.onrender.com
      - key: VITE_API_URL
        value: https://biotorf-backend.onrender.com
