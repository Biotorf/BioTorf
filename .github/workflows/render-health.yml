name: BioTorf Render health
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify the BioTorf API
        shell: bash
        env:
          HEALTH_URL: https://biotorf-backend.onrender.com/health
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if curl --silent --show-error --fail --max-time 20 "$HEALTH_URL" |
              jq -e '.ok == true and .service == "biotorf-comms"' >/dev/null; then
              printf 'BioTorf API is ready.\n'
              exit 0
            fi
            if (( attempt < 5 )); then sleep 8; fi
          done
          printf 'BioTorf API did not become ready.\n' >&2
          exit 1
