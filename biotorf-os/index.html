<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BIOTORF Business OS</title>
  <!-- PWA: установка как приложение (ярлык на рабочем столе) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#863bff" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BIOTORF" />
  <!-- Адрес бэкенда для статического хостинга (Render). Фронт и API живут на
       разных доменах, поэтому задаём URL сервера здесь, до загрузки бандла.
       Можно переопределить в консоли браузера:
         localStorage.setItem('biotorf.api.url','https://biotorf-backend.onrender.com') -->
  <script>window.__BIOTORF_API__ = 'https://biotorf-backend.onrender.com';</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
