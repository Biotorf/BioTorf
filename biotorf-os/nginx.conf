server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты Vue Router падают на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API и вебхуков на backend (имя сервиса в docker network)
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /webhooks/ {
        proxy_pass http://backend:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Аутентификация: вход/регистрация/выход/проверка токена — на backend.
    # Без этого блока POST /auth/* попадал в SPA-try_files и возвращал 405.
    location /auth/ {
        proxy_pass http://backend:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health       { proxy_pass http://backend:8787; }
    location = /docs         { proxy_pass http://backend:8787; }
    location = /openapi.json { proxy_pass http://backend:8787; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
