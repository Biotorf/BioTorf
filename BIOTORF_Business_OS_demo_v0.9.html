function renderPage(){const el=q('page');if(!el)return; if(!navAvailable().includes(view))view='dashboard';el.innerHTML=({dashboard:drawDashboard,crm:drawCRM,pipeline:drawPipeline,pilots:drawPilots,knowledge:drawKnowledge,social:drawSocial,products:drawProducts,orders:drawOrders,production:drawProduction,warehouse:drawWarehouse,shipments:drawShipments,finance:drawFinance,tasks:drawTasks,analytics:drawAnalytics,journey:drawJourney,calendar:drawCalendar,media:drawMedia,notifications:drawNotifications}[view]||drawDashboard)();document.querySelectorAll('[data-go]').forEach(e=>e.classList.toggle('active',e.dataset.go===view))}
const demoBanner=()=>`<div class="note"><b>Демонстрационный режим.</b> Карточки, суммы, сделки, запасы и операции — вымышленные примеры. Финансовые вводные AGRO/HOME взяты из предоставленной калькуляции и помечены как модель. Данные сохраняются <b>только в этом браузере</b>.</div>`;
function drawDashboard(){
 const revenue=db.orders.filter(o=>['Оплачен','Отправлен','Доставлен'].includes(o.status)).reduce((a,b)=>a+b.amount,0), liters=db.orders.filter(o=>['Оплачен','Отправлен','Доставлен'].includes(o.status)).reduce((a,b)=>a+b.qty*sku(b.sku).pack,0), pipeline=db.deals.filter(d=>!['Оплачено','Отгружено','Получено клиентом','Сопровождение','Повторный заказ','Сезонный контракт'].includes(d.stage)).reduce((a,b)=>a+b.amount,0), current=db.pilots.filter(p=>!['Завершен','Пилот прекращен'].includes(p.status)).length;
 let info,title='Панель управления',sub='Ситуация по компании, критические события и ключевые показатели';
 if(role==='sales_head'){title='Рабочий стол РОП';sub='Воронка отдела, прогноз и просроченные действия';info=[['Открытая воронка',money(pipeline),'По демонстрационным сделкам'],['Активные сделки',db.deals.length,'Стадии воронки'],['Новые обращения',db.leads.length,'В демо-базе'],['Просроченные задачи',lateTasks().length,'Требуют контроля']]}

function drawCalendar(){const d=calAnchor,mode=calMode,from=new Date(d.getFullYear(),d.getMonth(),d.getDate()),dayOffset=(from.getDay()+6)%7;let first,last;if(mode==='День'){first=from;last=new Date(+from+86400000)}else if(mode==='Неделя'){first=new Date(+from-dayOffset*86400000);last=new Date(+first+7*86400000)}else{first=new Date(d.getFullYear(),d.getMonth(),1);last=new Date(d.getFullYear(),d.getMonth()+1,1)}const fmt=x=>x.toISOString().slice(0,10);let events=calItems().filter(x=>x.date>=fmt(first)&&x.date<fmt(last)),days=mode==='Месяц'?42:mode==='Неделя'?7:1;let base=mode==='Месяц'?new Date(+first-((first.getDay()+6)%7)*86400000):first;const cells=Array.from({length:days},(_,i)=>{let v=new Date(+base+i*86400000),date=fmt(v);return `<div class="cal-cell ${v.getMonth()!==d.getMonth()&&mode==='Месяц'?'cal-muted':''}"><b>${v.toLocaleDateString('ru-RU',{day:'numeric',month:mode==='Месяц'?undefined:'short'})}</b>${calItems().filter(e=>e.date===date).slice(0,9).map(e=>`<button type="button" class="cal-event actionable cal-open" data-event-type="${H(e.type)}" data-event-id="${H(e.ref)}" title="${H(e.type)} · Открыть">${H(e.title)}</button>`).join('')}</div>`}).join('');return `${header('Единый календарь','Контакты, агрономия, задачи, логистика и маркетинг')}<div class="toolbar"><button type="button" class="btn slim ghost" data-action="calendar-back">← Назад</button><div class="chips">${['День','Неделя','Месяц'].map(m=>`<button class="btn slim ${m===mode?'primary':''}" data-calmode="${m}">${m}</button>`).join('')}</div><div class="chips"><button class="btn slim" data-calnav="-1">‹</button><button class="btn slim" data-calnav="0">Сегодня</button><button class="btn slim" data-calnav="1">›</button><b>${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b></div></div><div class="panel"><div class="cal-grid">${cells}</div></div>${panel('События периода',events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="insight actionable" role="button" tabindex="0 const JOURNEY_PHASES=['Новый лид','Квалифицирован','Сделка создана','Пилот создан','КП подготовлено','Заказ создан','Оплата подтверждена','Отгрузка оформлена','Доставлено'];
db.journeys??=[];
function getJourney(jid){return db.journeys.find(x=>x.id===jid)}
function journeyFarm(j){return db.farms.find(f=>f.id===j.farmId)}
function jbutton(label,action,j,cls='ghost slim'){return button(label,action,cls,`data-id="${H(j.id)}"`)}
function drawJourney(){db.journeys??=[];db.quotes??=[];const rows=db.journeys.filter(j=>matching(j.name,j.crop,j.region,j.source,j.status));let selected=rows.map(j=>`<div class="hero-card" style="margin-bottom:11px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><b>${H(j.name)}</b>${pill(j.status)}</div><div class="mini">${H(j.id)} · ${H(j.region)} · ${H(j.crop)} · ${H(j.area)} га · источник: ${H(j.source)}</div><div class="context-tags">${[['Лид',j.leadId],['Хозяйство',j.farmId],['Сделка',j.dealId],['Пилот',j.pilotId],['КП',j.quoteId],['Заказ',j.orderId],['Счет',j.invoiceId],['Отгрузка',j.shipmentId]].filter(a=>a[1]).map(a=>`<span class="chip">${a[0]} ${H(a[1])}</span>`).join('')}</div><div class="actionbar">${jbutton('Открыть карточку','journey-open',j,'primary slim')}</div></div>`).join('');return `${header('Сквозной коммерческий процесс','Одна карточка, связанная с лидом, хозяйством, сделкой, пилотом, заказом и оплатой',button('+ Начать с лида','journey-new'))}${demoBanner()}<div class="stats">${stat('Процессы',db.journeys.length,'Созданы через единый мастер')}${stat('Сделки',db.journeys.filter(j=>j.dealId).length,'Без повторного ввода')}${stat('Заказы',db.journeys.filter(j=>j.orderId).length,'Из коммерческого процесса')}${stat('Доставлены',db.journeys.filter(j=>j.status==='Доставлено').length,'Подтвержденные демонстрационно')}</div>${panel('Коммерческие циклы',selected||'<div class="empty">Начните с создания лида. Новый процесс автоматически сформирует запись в CRM.</div>')}`}
function jform(title,contents){modal(title,`<form id="journey-form" class="formgrid" data-jstep="${H(contents.step)}" data-jid="${H(contents.jid||'')}">${contents.html}<div class="field full" style="display:flex;flex-direction:row;justify-content:flex-end;margin-top:15px">${button('Отмена','close-modal','ghost')} <button class="btn primary" type="submit">${contents.submit||'Сохранить'}</button></div></form>`)}
function jfield(name,label,type='text',req=true,extra=''){return field(name,label,type,req,extra)}
function journeyOpen(j){let ix=JOURNEY_PHASES.indexOf(j.status),farmj=journeyFarm(j);let btns=[];if(!j.qualified)btns.push(jbutton('1. Квалифицировать контрагента','journey-qualify',j,'primary'));if(j.qualified&&j.farmId&&!j.dealId)btns.push(jbutton('2. Создать сделку','journey-deal',j,'primary'));if(j.dealId&&!j.pilotId&&!j.quoteId)btns.push(jbutton('3а. Создать пилот','journey-pilot',j));if(j.dealId&&!j.quoteId)btns.push(jbutton('3б. Подготовить КП','journey-quote',j,'primary'));if(j.quoteId&&!j.orderId)btns.push(jbutton('4. Создать заказ и счет','journey-order',j,'primary'));if(j.invoiceId&&!j.paid)btns.push(jbutton('5. Подтвердить оплату','journey-payment',j,'primary'));if(j.paid&&!j.shipmentId)btns.push(jbutton('6. Оформить отгрузку','journey-ship',j,'primary'));if(j.shipmentId&&j.status!=='Доставлено')btns.push(jbutton('7. Подтвердить доставку','journey-deliver',j,'primary'));let timeline=(j.history||[]).slice().reverse().map(h=>`<div class="event"><b>${H(h.what)}</b><div class="mini">${H(h.at)}</div></div>`).join('');modal('Коммерческий процесс · '+j.id,`<div class="banner"><div><strong>${H(j.name)}</strong><small>${H(j.status)} · ${H(j.crop)} · ${H(j.area)} га</small></div></div><div class="details-grid">${[['Лид',j.leadId],['Хозяйство',farmj?.name],['Сделка',j.dealId],['Пилот',j.pilotId],['КП',j.quoteId],['Заказ',j.orderId],['Счет',j.invoiceId],['Отгрузка',j.shipmentId]].map(([k,v])=>`<div class="detail"><dt>${k}</dt><dd>${H(v||'Не создано')}</dd></div>`).join('')}</div><h3 style="margin-top:18px">Следующее действие</h3><div class="actionbar">${btns.join('')||'Коммерческий цикл завершен'}</div><h3 style="margin-top:20px">Единая история</h3><div class="timeline">${timeline}</div>`)}
function jlog(j,what){j.history??=[];j.history.push({at:new Date().toLocaleString('ru-RU'),what});save(what,j.id);closeModal();view='journey';paintShell();journeyOpen(j)}
function journeyAction(action,btn){let j=getJourney(btn?.dataset.id);if(action==='journey-from-post'){db.journeys??=[];db.quotes??=[];journeyAction('journey-new');let el=modalRoot.querySelector('[name=postId]');if(el)el.value=btn.dataset.id;return}if(action==='journey-new'){db.journeys??=[];db.quotes??=[];jform('Новый лид · шаг 1',{step:'start',submit:'Создать лид',html:jfield('name','Название хозяйства / обращение')+jfield('phone','Телефон / WhatsApp','text',false)+jfield('region','Регион','select:Чуйская область|Иссык-Кульская область|Ошская область|Джалал-Абадская область|Таласская область|Нарынская область|Баткенская область')+jfield('crop','Культура (если известна)','text',false)+jfield('area','Площадь, га (если известна)','number',false,'min="0" step="0.01"')+jfield('source','Источник','select:Instagram|WhatsApp|Телефон|Сайт|Рекомендация|Мероприятие')+`<div class="field"><label>Публикация-источник</label><select name="postId" class="select"><option value="">Без привязки</option>${db.social.map(p=>`<option value="${H(p.id)}">${H(p.id)} · ${H(p.title)}</option>`).join('')}</select></div>`+jfield('next','Дата следующего контакта','date',true,`value="${today()}"`)});return}if(!j)return;if(action==='journey-open'){journeyOpen(j);return}if(action==='journey-qualify'){jform('Квалификация · '+j.id,{step:'qualify',jid:j.id,submit:'Сохранить квалификацию',html:`<div class="field full">При квалификации связываем существующий объект или создаём карточку контрагента. Для магазина и оптовой базы поля и пилот не обязательны.</div>`+jfield('clientType','Тип контрагента','select:Не определён|Агропроизводитель|Розничный магазин|Оптовая база|Дилер|Дистрибьютор|Прочий')+jfield('company','Наименование контрагента','text',false)+jfield('crop','Культура (для хозяйств)','text',false)+jfield('area','Площадь, га (для хозяйств)','number',false,'min="0" step="0.01"')+jfield('problem','Потребность / описание деятельности','text',false)+jfield('manager','Ответственный','select:Менеджер А|Менеджер Б')});return}if(action==='journey-deal'){jform('Создать сделку · '+j.id,{step:'deal',jid:j.id,html:jfield('liters','Ожидаемый объем, л','number',true,'min="0" step="0.1"')+jfield('amount','Потенциал, сом','number',true,'min="0" step="1"')});return}if(action==='journey-pilot'){jform('Создать пилот · '+j.id,{step:'pilot',jid:j.id,html:jfield('pilotArea','Площадь пилота, га','number',true,`min="0.001" step="0.001" value="${Math.min(1,Number(j.area))}"`)+jfield('control','Контроль, га','number',true,'min="0" step="0.001"')+jfield('goal','Цель испытания')});return}if(action==='journey-quote'){jform('Коммерческое предложение · '+j.id,{step:'quote',jid:j.id,html:jfield('sku','Продукт','select:'+db.skus.map(x=>x.id).join('|'))+jfield('qty','Упаковок','number',true,'min="1" step="1"')+jfield('price','Цена за упаковку, сом (демо)','number',true,'min="0" step="1"')+jfield('note','Условия и комментарии','textarea',false)});return}if(action==='journey-order'){let x=db.quotes.find(x=>x.id===j.quoteId);if(!x)return;j.quoteTotal=x.qty*x.price; jform('Подтвердить заказ · '+j.id,{step:'order',jid:j.id,submit:'Создать заказ и счет',html:`<p class="field full">Из КП ${H(x.id)}: ${H(x.sku)} × ${x.qty} = ${money(j.quoteTotal)}. Сумма будет скопирована без ручного ввода.</p>`+jfield('due','Оплатить до','date',true,`value="${datePlus(7)}"`)});return}if(action==='journey-payment'){let x=db.invoices.find(x=>x.id===j.invoiceId);jform('Подтверждение оплаты · '+j.id,{step:'payment',jid:j.id,html:`<div class="field full">К оплате: ${money(x.amount-x.paid)}. Это ручное подтверждение для демонстрации, не банковская интеграция.</div>`+jfield('amount','Сумма поступления, сом','number',true,`min="0.01" step="0.01" value="${x.amount-x.paid}"`)+jfield('reference','Номер платежного документа')});return}if(action==='journey-ship'){jform('Оформить отгрузку · '+j.id,{step:'ship',jid:j.id,html:jfield('carrier','Перевозчик')+jfield('planned','План доставки','date',true,`value="${datePlus(3)}"`)});return}if(action==='journey-deliver'){let x=db.shipments.find(s=>s.id===j.shipmentId);x.status='Доставлен';x.actual=today();j.status='Доставлено';db.orders.find(o=>o.id===j.orderId).status='Доставлен';jlog(j,'Доставка подтверждена');return}}
function journeySubmit(form){const v=Object.fromEntries(new FormData(form).entries()),step=form.dataset.jstep,j=getJourney(form.dataset.jid);if(step==='start'){db.journeys??=[];db.quotes??=[];if(v.area && (!Number.isFinite(+v.area)||+v.area<0))return notify('Проверьте площадь',true);let lead={id:id('L',db.leads),name:v.name,farmId:'',source:v.source,postId:v.postId,owner:'Менеджер А',next:v.next,status:'Новый лид',date:today(),phone:v.phone};db.leads.unshift(lead);let jj={id:'FLOW-'+String(Date.now()).slice(-8),name:v.name,phone:v.phone,region:v.region,crop:v.crop,area:+v.area,source:v.source,postId:v.postId,leadId:lead.id,status:'Новый лид',history:[]};db.journeys.unshift(jj);db.tasks.unshift({id:id('T',db.tasks),title:'Квалифицировать: '+v.name,who:'Менеджер',due:v.next,status:'Новая',object:lead.id,priority:'Высокий'});if(v.postId)db.marketingAttributions.unshift({id:id('ATR',db.marketingAttributions),postId:v.postId,leadId:lead.id,dealId:'',revenue:0});jlog(jj,'Зарегистрирован лид '+lead.id);return}if(!j)return;if(step==='qualify'){let isFarm=v.clientType==='Агропроизводитель';let f=j.farmId?db.farms.find(x=>x.id===j.farmId):null;if(!f){f={id:id('F',db.farms),name:v.company?.trim()||j.name,phone:j.phone,region:j.region,crop:isFarm?(v.crop||j.crop||''):'',area:isFarm?Number(v.area||j.area||0):0,source:j.source,owner:v.manager,next:datePlus(3),status:'Квалифицирован',type:v.clientType||'Не определён',hasFarm:isFarm,problem:v.problem};db.farms.push(f)}else{f.owner=v.manager;f.status='Квалифицирован';f.type=v.clientType||f.type;f.hasFarm=isFarm;f.problem=v.problem}j.farmId=f.id;j.clientType=f.type;j.qualified=true;j.status='Квалифицирован';let l=db.leads.find(x=>x.id===j.leadId);l.farmId=f.id;l.status='Квалифицирован';jlog(j,'Создано хозяйство '+f.id);return}if(step==='deal'){let d={id:id('D',db.deals),farmId:j.farmId,leadId:j.leadId,title:j.name+' · '+j.crop,amount:+v.amount,liters:+v.liters,owner:'Менеджер А',next:datePlus(3),prob:15,stage:'Квалификация',date:today()};db.deals.unshift(d);j.dealId=d.id;j.status='Сделка создана';let atr=db.marketingAttributions.find(x=>x.leadId===j.leadId);if(atr)atr.dealId=d.id;jlog(j,'Создана сделка '+d.id);return}if(step==='pilot'){if(+v.pilotArea<=0||+v.control>+v.pilotArea)return notify('Неверная площадь пилота / контроля',true);let p={id:id('P',db.pilots),farmId:j.farmId,dealId:j.dealId,crop:j.crop,area:+v.pilotArea,control:+v.control,status:'Новый пилот',owner:'Агроном (демо)',start:today(),next:datePlus(4),goal:v.goal,result:'',evidence:false};db.pilots.unshift(p);j.pilotId=p.id;j.status='Пилот создан';db.deals.find(x=>x.id===j.dealId).stage='Пилот согласован';jlog(j,'Пилот '+p.id+' связан со сделкой');return}if(step==='quote'){if(+v.qty<=0||+v.price<0)return notify('Некорректная цена или количество',true);let x={id:id('Q',db.quotes),dealId:j.dealId,farmId:j.farmId,sku:v.sku,qty:+v.qty,price:+v.price,note:v.note,date:today()};db.quotes.unshift(x);j.quoteId=x.id;j.status='КП подготовлено';let d=db.deals.find(d=>d.id===j.dealId);d.stage='КП отправлено';d.amount=x.qty*x.price;d.liters=x.qty*sku(x.sku).pack;jlog(j,'КП '+x.id+' подготовлено; цена демонстрационная');return}if(step==='order'){let quote=db.quotes.find(x=>x.id===j.quoteId),o={id:id('SO',db.orders),dealId:j.dealId,farmId:j.farmId,sku:quote.sku,qty:quote.qty,amount:quote.qty*quote.price,date:today(),status:'Ожидает оплаты'},inv={id:id('INV',db.invoices),orderId:o.id,amount:o.amount,paid:0,status:'Ожидается оплата',due:v.due};db.orders.unshift(o);db.invoices.unshift(inv);j.orderId=o.id;j.invoiceId=inv.id;j.status='Заказ создан';db.deals.find(d=>d.id===j.dealId).stage='Ожидается оплата';jlog(j,'Заказ '+o.id+' и счет '+inv.id+' созданы из КП');return}if(step==='payment'){let x=db.invoices.find(x=>x.id===j.invoiceId),n=+v.amount;if(!Number.isFinite(n)||n<=0||n>x.amount-x.paid+0.001)return notify('Неверная сумма платежа',true);x.paid+=n;x.status=x.paid>=x.amount?'Оплачен':'Частично оплачен';db.payments.unshift({id:id('PAY',db.payments),invoiceId:x.id,amount:n,date:today(),reference:v.reference});if(x.status==='Оплачен'){j.paid=true;j.status='Оплата подтверждена';db.orders.find(o=>o.id===j.orderId).status='Оплачен';db.deals.find(d=>d.id===j.dealId).stage='Оплачено'}jlog(j,'Получена оплата '+money(n));return}if(step==='ship'){let s={id:id('SH',db.shipments),orderId:j.orderId,carrier:v.carrier,planned:v.planned,actual:'',status:'К отправке'};db.shipments.unshift(s);j.shipmentId=s.id;j.status='Отгрузка оформлена';db.orders.find(o=>o.id===j.orderId).status='К отправке';jlog(j,'Оформлена отгрузка '+s.id);return}}
// make the preferences functional for CRM table (other tables unchanged)
const oldDrawSocial=drawSocial;
drawSocial=function(){let html=oldDrawSocial();return html.replace(/(<article class="hero-card">[\s\S]*?<div class="eyebrow">[\s\S]*?(SOC-\d+)[\s\S]*?<\/article>)/g,(full)=>{let idm=full.match(/SOC-\d+/),post=idm?db.social.find(p=>p.id===idm[0]):null;if(!post)return full;return full.replace('</article>',`<div class="actionbar" style="margin-top:12px">${button('Создать лид из публикации','journey-from-post','slim ghost',`data-id="${H(post.id)}"`)}</div></article>`)});};
const prevDrawCRM=drawCRM;
drawCRM=function(){let pref=db.preferences[role]||{},original=db.farms,sorted=[...original];if(pref.sort==='Название')sorted.sort((a,b)=>a.name.localeCompare(b.name,'ru'));else if(pref.sort==='Регион')sorted.sort((a,b)=>a.region.localeCompare(b.region,'ru'));else if(pref.sort==='Срок (сначала ближайшие)')sorted.sort((a,b)=>(a.next||'9999').localeCompare(b.next||'9999'));db.farms=sorted;let html=prevDrawCRM();db.farms=original;let tableKey=['Хозяйство','Регион','Культура','Площадь','Источник','Ответственный','Следующий контакт'];let active=(pref.columns?.length?pref.columns:tableKey).map(x=>({'Хозяйство':'Клиент / хозяйство','Ответственный':'Менеджер','Следующее действие':'След. контакт','Источник':'Источники'}[x]||x));let tableStart=html.indexOf('<table class="table">');if(tableStart>=0){let thStart=html.indexOf('<thead>',tableStart),thEnd=html.indexOf('</thead>',thStart),bodyStart=html.indexOf('<tbody>',thEnd),bodyEnd=html.indexOf('</tbody>',bodyStart);if(thStart>=0&&bodyStart>=0){let thead=html.slice(thStart,thEnd),trs=html.slice(bodyStart,bodyEnd);let headers=[...thead.matchAll(/<th[^>]*>([\s\S]*?)<\/th>/g)].map(m=>m[1].replace(/<[^>]*>/g,'').trim());let idx=headers.map((h,i)=>active.some(a=>h.toLowerCase().includes(a.toLowerCase())||a.toLowerCase().includes(h.toLowerCase()))?i:-1).filter(i=>i>=0);if(idx.length){let rows=[...trs.matchAll(/<tr[^>]*>[\s\S]*?<\/tr>/g)].map(m=>m[0]);let newRows=rows.map(r=>{let tds=[...r.matchAll(/<td[^>]*>[\s\S]*?<\/td>/g)].map(x=>x[0]);return r.replace(/<td[\s\S]*<\/tr>/,idx.map(i=>tds[i]||'').join('')+'</tr>')});html=html.slice(0,thStart)+'<thead><tr>'+idx.map(i=>`<th>${H(headers[i])}</th>`).join('')+'</tr></thead><tbody>'+newRows.join('')+'</tbody>'+html.slice(bodyEnd+8)}}}return html};
const oldDrawDashboard=drawDashboard;
drawDashboard=function(){let p=db.preferences[role]||{},d=p.period||'Весь период',days=d.includes('Недел')?7:d.includes('Месяц')?30:0;if(!days)return oldDrawDashboard();let oldO=db.orders,oldD=db.deals,oldL=db.leads;let cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);let within=x=>!x.date||new Date(x.date)>=cutoff;db.orders=oldO.filter(within);db.deals=oldD.filter(within);db.leads=oldL.filter(within);try{return oldDrawDashboard()}finally{db.orders=oldO;db.deals=oldD;db.leads=oldL}};
const oldRenderPage=renderPage;
renderPage=function(){oldRenderPage();if(view==='dashboard'){let p=db.preferences[role]?.period||'Весь период';document.querySelector('#page .pagehead .subtitle')?.insertAdjacentHTML('beforeend',` · Период: ${H(p)}`)}let st=document.querySelector('#page .stats');if(st&&view==='dashboard'){let pref=db.preferences[role]||{},cards=[...st.children];cards.forEach(c=>{c.dataset.kpiLabel=c.querySelector('.label')?.textContent||'';c.insertAdjacentHTML('beforeend','<div class="kpi-move"><button type="button" data-kpi-dir="-1" title="Сдвинуть влево">←</button><button type="button" data-kpi-dir="1" title="Сдвинуть вправо">→</button></div>')});if(pref.kpiOrder?.length)st.append(...cards.sort((a,b)=>(pref.kpiOrder.indexOf(a.dataset.kpiLabel)<0?99:pref.kpiOrder.indexOf(a.dataset.kpiLabel))-(pref.kpiOrder.indexOf(b.dataset.kpiLabel)<0?99:pref.kpiOrder.indexOf(b.dataset.kpiLabel))))}let pref=db.preferences[role]||{},period=pref.period;if(period&&period!=='Все время'&&period!=='Все'){let cut=period.includes('Недел')?7:period.includes('Месяц')?30:period.includes('Квартал')?90:0;if(cut){const daysAgo=d=>(new Date().getTime()-new Date(d).getTime())/86400000<=cut;document.querySelectorAll('#page [data-period-date]').forEach(n=>{n.style.display=daysAgo(n.dataset.periodDate)?'':'none'})}}};
const oldPaintShell=paintShell;
paintShell=function(){oldPaintShell();const nav=document.querySelector('.nav');if(nav&&!nav.querySelector('[data-go="journey"]')&&['director','sales_head','sales','dispatcher'].includes(role)){let b=document.createElement('button');b.dataset.go='journey';b.innerHTML='<span style="font-size:17px;width:22px">⤳</span> Сквозной процесс';b.onclick=()=>{view='journey';paintShell()};nav.insertBefore(b,nav.children[3]||null)}if(view==='journey')renderPage()};
db.quotes??=[];

paintShell();
})();
